[package]
name = "kalatori-client"
version = "0.1.0"
edition = "2024"
description = "A client for non-castodial crypto payment-gateway Kalatori."
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
# Signature
hmac = "0.13"
sha2 = "0.11"
const-hex = "1"

# Types
uuid = { version = "1", features = ["v4", "serde"] }
# Floor, not a preference -- see the note in daemon/Cargo.toml. Consumers of
# this crate resolve their own lockfile, so the broken versions have to be
# excluded here, not just locked out of ours.
rust_decimal = "1.42.1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
secrecy = "0.10"
# Re-exported in lib.rs so daemon shares the same strum types/derives as this
# crate. This used to be held at 0.27.2 to match alloy-chains and avoid two
# copies of strum in the tree; alloy-chains dropped its strum dependency
# entirely as of 0.2.36, so we are now the only consumer and free to move.
strum = { version = "0.28", features = ["derive"] }

# Client
serde = { version = "1", features = ["derive"] }
http = "1"
# Please keep reqwest version in sync with the one in daemon/Cargo.toml
reqwest = { version = "0.13", features = ["json", "query"], optional = true }

# Middlewares
axum = { version = "0.8", features = ["original-uri"], optional = true }

# Database
sqlx = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["client"]
client = ["reqwest"]
axum-middleware = ["axum"]
sqlx-types = ["sqlx"]

[lints]
workspace = true

[[example]]
name = "webhook"
required-features = ["axum-middleware"]

[[example]]
name = "generate_hmac_test_vectors"
