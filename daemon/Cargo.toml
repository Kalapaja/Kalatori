[package]
name = "kalatori"
version = "0.9.4"
edition = "2024"
description = "A non-custodial crypto payment-gateway daemon."
homepage = "https://github.com/Kalapaja/Kalatori"
documentation = "https://docs.rs/Kalatori"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[dependencies]
kalatori-client = { path = "../client", features = ["axum-middleware", "sqlx-types"] }

# Types and data serialization utils
uuid = { version = "1", features = ["v4", "serde"] }
# 1.42.1 is a floor, not a preference: 1.41.0 and 1.42.0 lose the borrow when
# subtracting rescaled operands (paupino/rust-decimal#804) and are not yanked.
rust_decimal = { version = "1.42.1", features = ["serde", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_with = "3.18"
secrecy = { version = "0.10", features = ["serde"] }
base58 = "0.2.0"
blake2b_simd = "1.0"
const-hex = "1"

# Async runtime and utils
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-lock = "3"
async-stream = "0.3"
futures = "0.3"

# Web server
axum = { version = "0.8", default-features = false, features = [
    "tokio",
    "http1",
    "query",
    "json",
    "form",
    "matched-path",
    "original-uri",
    "macros",
] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "cors", "fs", "normalize-path"] }

# Database
# On update sqlx version, plase also update sqlx-cli to corresponding version in Makefile
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite-unbundled",
    "macros",
    "migrate",
    "chrono",
    "uuid",
    "json"
] }

# Asset Hub chain
# On update subxt version, plase also update subxt-cli to corresponding version in Makefile
subxt = "0.44"
subxt-signer = "0.44"

# Polygon chain
alloy = { version = "2.0", features = [
    "provider-ws",
    "rpc-types-eth",
    "contract",
    "sol-types",
    "signers",
    "signer-local",
    "network",
    "consensus",
    "signer-mnemonic",
    "eip712",
] }
# Subxt-signer uses bip39 and moreover re-exports it, but for some reason it doesn't have zeroize feature enabled
bip39 = { version = "2", features = ["zeroize"] }
# This dependency is required by subxt in order to compile the runtime types
# and specifically to derive Encode trait (using macro) to MultiLocation type used
# as AssetId in order to support fee payment in the same asset as transferred one.
parity-scale-codec = { version = "3", features = ["derive"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "json"] }
# Default features pull reqwest/native-tls, i.e. OpenSSL on Linux, alongside the
# rustls/aws-lc stack every money path already uses. Log shipping does not get to
# add a second TLS implementation. `compat-0-2-1` is not optional: the crate
# refuses to compile without it.
#
# What this does not buy: openssl 0.10.78 is affected by no open advisory
# (RUSTSEC-2025-0022 was patched in >= 0.10.72). The win is dropping runtime
# linkage to the C libssl -- OS-level CVE surface that `cargo deny` cannot see
# -- not closing a known hole. `deny.toml` no longer allows the OpenSSL license,
# which keeps the stack from coming back.
tracing-loki = { version = "0.2", default-features = false, features = [
    "compat-0-2-1",
    "rustls",
] }
# Trust store, not a second TLS stack. tracing-loki's `rustls` feature maps to
# reqwest 0.12's `rustls-tls`, and in that major `rustls-tls` is hard-wired to
# `rustls-tls-webpki-roots` -- a bundled root bundle, not the operating
# system's. The daemon's own reqwest is 0.13, whose `rustls` routes through
# rustls-platform-verifier and does read the OS store, so leaving this alone
# would make log shipping the one subsystem in the daemon that ignores a CA the
# operator installed. Silently, and only for Loki: payments would keep flowing
# while log pushes failed certificate validation.
#
# tracing-loki 0.2 exposes no native-roots variant, so the feature has to be
# turned on for reqwest 0.12 directly. Cargo unifies features per resolved
# package, so naming it here applies to the instance tracing-loki resolves to;
# the crate is never imported. reqwest 0.12 adds the two root sources in
# independent branches, so this is additive -- webpki roots plus the OS store,
# never fewer roots than before this change.
loki-transport-roots = { package = "reqwest", version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
] }

# Utils
config = "0.15"
hkdf = "0.13"
chacha20poly1305 = "0.10"
base64 = "0.22"
pasetors = { version = "0.7", default-features = false, features = ["v4", "paserk", "std"] }
url = "2"
# Please keep reqwest version in sync with the one in kalatori-client
reqwest = { version = "0.13", features = ["json", "form"] }
# Need to include it directly cause different servers/clients use different crypto providers
# which is not allowed by rustls and we need to manually specify which one to use as default
# See details here: https://docs.rs/rustls/latest/rustls/crypto/struct.CryptoProvider.html#using-the-per-process-default-cryptoprovider
rustls = "0.23"
zeroize = "1"
# Don't forget to update me in `[build-dependencies]`!
shadow-rs = { version = "0.36", default-features = false }
thiserror = "2"
trait-variant = "0.1"
sha2 = "0.11"
# Let's add some random and fun to financial operations :) (it's a joke, we don't really do anything like that)
rand = "0.10"
governor = "0.10"
zip = "8.5"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
mockall = "0.14"
mockall_double = "0.3"
httpmock = "0.8"
indoc = "2"
tracing-test = "0.2"
insta = { version = "1", features = ["json", "yaml", "redactions"] }

[build-dependencies]
# Don't forget to update me in `[dependencies]`!
shadow-rs = { version = "0.36", default-features = false }

[features]
default = []
dev_api = []

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[lints]
workspace = true
