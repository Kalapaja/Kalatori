[workspace]
members = [
    "daemon",
    "client",
    "tools/cargo-bin",
]
resolver = "3"

[workspace.package]
# Actual floor of the current lockfile, measured across all crate versions in
# the graph. Every member inherits it, so there is one number to keep honest --
# including the client, which is consumed as a library and for which MSRV is
# part of the public contract. Also feeds resolver = "3" MSRV-aware version
# selection, which is what keeps alloy at 2.1.x (see .github/dependabot.yml).
rust-version = "1.91"
authors = [
	"Alexander Slesarev <slesarew@gmail.com>",
    	"Vova Lando <vova.lando@gmail.com>",
     	"Artyom Sheviakov <fluidcells@pm.me>",
]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Kalapaja/Kalatori"
keywords = ["substrate", "blockchain", "finance", "service", "middleware"]
categories = ["finance"]
exclude = [".github", "cliff.toml", "Dockerfile", "chopsticks/", "configs", "is_version_greater.sh", "/tests"]

[workspace.lints.rust]
future_incompatible = "warn"
let_underscore = "warn"
rust_2018_idioms = "warn"
unused = "warn"

[workspace.lints.clippy]
allow_attributes = "deny"
cargo_common_metadata = "warn"
cast_possible_truncation = "warn"
ignored_unit_patterns = "warn"

# --- Panic gate ---
#
# The daemon serves unauthenticated `/public` routes, and `set_panic_hook`
# (daemon/src/utils/shutdown.rs) cancels the shutdown token on *any* panic, in
# any thread. The hook runs before unwinding, so nothing downstream can contain
# it: one reachable panic is a remote kill switch for the payment gateway.
#
# These lints turn the panic-capable constructs *in our own code* into compile
# errors. They are not a complete guarantee — see docs/conventions.md ("Panic
# Gate") for what is and is not covered, and for how to satisfy them.
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
# Having multiple module layout styles in a project can be confusing. Moreover, `mod.rs` files don't
# really harmonize with Git as they can be renamed back to self-named modules and Git fundamentally
# prone to poorly handle the file renaming that can result in their history erasure.
mod_module_files = "warn"
# TODO: we'll add docs and remove this later

[workspace.metadata.bin]
# Please keep in sync with subxt version in daemon/Cargo.toml and in subxt-cli version in Dockerfile
subxt-cli = { version = "0.44.3", bins = ["subxt"], locked = true }
# Please keep in sync with sqlx version in daemon/Cargo.toml
sqlx-cli = { version = "0.8.6", locked = true, default-features = false, features = ["sqlite", "completions"] }
cargo-nextest = { version = "0.9.143", locked = true }
cargo-llvm-cov = { version = "0.8.7", locked = true }
cargo-mutants = { version = "26.2.0", locked = true }
cargo-insta = { version = "1.48.0", locked = true }
