[workspace]
members = [
    "daemon",
    "client",
    "tools/cargo-bin",
]
resolver = "3"

[workspace.package]
# Actual floor of the current lockfile, measured across all crate versions in
# the graph. Every member inherits it, so there is one number to keep honest --
# including the client, which is consumed as a library and for which MSRV is
# part of the public contract. Also feeds resolver = "3" MSRV-aware version
# selection, which is what keeps alloy at 2.1.x (see .github/dependabot.yml).
rust-version = "1.91"
authors = [
	"Alexander Slesarev <slesarew@gmail.com>",
    	"Vova Lando <vova.lando@gmail.com>",
     	"Artyom Sheviakov <fluidcells@pm.me>",
]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Kalapaja/Kalatori"
keywords = ["substrate", "blockchain", "finance", "service", "middleware"]
categories = ["finance"]
exclude = [".github", "cliff.toml", "Dockerfile", "chopsticks/", "configs", "is_version_greater.sh", "/tests"]

[workspace.lints.rust]
future_incompatible = "warn"
let_underscore = "warn"
rust_2018_idioms = "warn"
unused = "warn"

[workspace.lints.clippy]
allow_attributes = "deny"
# This is a payment daemon: a silent wrap or truncation in an amount, fee or
# token-unit conversion is a money bug. Every `+`/`-`/`*`/`/` on a numeric or
# `Decimal` type must be explicitly checked, saturating, or justified with an
# `#[expect(..., reason = "...")]` that says why it cannot overflow.
arithmetic_side_effects = "warn"
cargo_common_metadata = "warn"
cast_possible_truncation = "warn"
ignored_unit_patterns = "warn"

# --- Panic gate ---
#
# The daemon serves unauthenticated `/public` routes, and `set_panic_hook`
# (daemon/src/utils/shutdown.rs) cancels the shutdown token on *any* panic, in
# any thread. The hook runs before unwinding, so nothing downstream can contain
# it: one reachable panic is a remote kill switch for the payment gateway.
#
# These lints turn the panic-capable constructs *in our own code* into compile
# errors. They are not a complete guarantee — see docs/conventions.md ("Panic
# Gate") for what is and is not covered, and for how to satisfy them.
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
# Having multiple module layout styles in a project can be confusing. Moreover, `mod.rs` files don't
# really harmonize with Git as they can be renamed back to self-named modules and Git fundamentally
# prone to poorly handle the file renaming that can result in their history erasure.
mod_module_files = "warn"
# TODO: we'll add docs and remove this later

# Build profiles. These MUST live in the workspace root manifest: Cargo silently
# ignores `[profile.*]` tables declared in non-root workspace members, which is
# how `overflow-checks` quietly stopped applying to the release binary.
[profile.dev]
debug = "line-tables-only"

# There is deliberately no `[profile.dev.package."*"] opt-level = 3` here. It sat
# in the daemon manifest, where Cargo ignored it, so nothing has ever actually
# built that way; switching it on with this move cost about nine minutes per cold
# build — every CI run, every clean checkout — to speed up a daemon that spends
# its time waiting on chains and a database. Nothing above depends on it, and no
# check loses fidelity without it: `overflow-checks` and the rest of the release
# profile below are what this move exists for.

[profile.release]
strip = true
lto = true
codegen-units = 1
overflow-checks = true
# Deliberately no `panic = "abort"`. It was added in 2024 when this was a single
# crate, went inert in `18728dfd` when the workspace split moved the profile into
# `daemon/Cargo.toml`, and would be revived — not introduced — by moving it back.
# `set_panic_hook` (daemon/src/utils/shutdown.rs) cancels the shutdown token so
# the executor, chain trackers, webhook sender and keyring can drain; abort runs
# the hook and then kills the process before anything observes the token, and it
# also removes Tokio's per-task panic containment, so a panic in one spawned task
# takes the daemon down instead of surfacing as a `JoinError`.

[workspace.metadata.bin]
# Please keep in sync with subxt version in daemon/Cargo.toml and in subxt-cli version in Dockerfile
subxt-cli = { version = "0.44.0", bins = ["subxt"], locked = true }
# Please keep in sync with sqlx version in daemon/Cargo.toml
sqlx-cli = { version = "0.8.6", locked = true, default-features = false, features = ["sqlite", "completions"] }
cargo-nextest = { version = "0.9.133", locked = true }
cargo-llvm-cov = { version = "0.8.4", locked = true }
cargo-mutants = { version = "26.2.0", locked = true }
cargo-insta = { version = "1.46.3", locked = true }
